<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计算器 · 832401217</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 整页只有一个主区域：左侧计算器，右侧历史记录占位 -->
  <main class="app">
    <section class="calc" aria-label="计算器">
      <!--
        吉祥物：奶龙。
        用**内联 SVG 手绘**，不引用任何外部图片文件 —— 所以不联网也能显示，
        也不需要从网上下载任何素材（既避免安全风险，也没有版权问题）。
      -->
      <div class="calc__mascot" aria-hidden="true">
        <svg class="mascot" viewBox="0 0 240 172">
          <defs>
            <linearGradient id="earShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#eaf5fc"/>
            </linearGradient>
          </defs>

          <!-- 卷卷的小尾巴 -->
          <path d="M196 128c12 0 20-7 20-17s-9-17-18-14-13 12-9 19"
                fill="none" stroke="#e3eef8" stroke-width="9" stroke-linecap="round"/>

          <!-- 两只长耳朵：从头顶向上再向外弯，耳尖自然垂下来 -->
          <path d="M92 62C70 60 52 78 50 106c-2 25 9 40 21 41 11 1 17-9 17-25 0-20 6-46 12-60z"
                fill="url(#earShade)" stroke="#e0ecf7" stroke-width="2"/>
          <path d="M148 62c22-2 40 16 42 44 2 25-9 40-21 41-11 1-17-9-17-25 0-20-6-46-12-60z"
                fill="url(#earShade)" stroke="#e0ecf7" stroke-width="2"/>

          <!-- 脑袋 -->
          <circle cx="120" cy="86" r="48" fill="#ffffff" stroke="#e0ecf7" stroke-width="2"/>

          <!-- 圆眼睛（带一点高光） -->
          <ellipse cx="103" cy="88" rx="6" ry="7.5" fill="#3d4f6b"/>
          <ellipse cx="137" cy="88" rx="6" ry="7.5" fill="#3d4f6b"/>
          <circle cx="105" cy="85" r="2.2" fill="#ffffff"/>
          <circle cx="139" cy="85" r="2.2" fill="#ffffff"/>

          <!-- 腮红 -->
          <ellipse cx="88" cy="101" rx="10" ry="6.5" fill="#ffd3dd" opacity=".85"/>
          <ellipse cx="152" cy="101" rx="10" ry="6.5" fill="#ffd3dd" opacity=".85"/>

          <!-- 小嘴：一条浅浅的 w -->
          <path d="M113 101q7 8 14 0" fill="none" stroke="#c9d8e8" stroke-width="2.4"
                stroke-linecap="round"/>

          <!-- 左耳上的蓝色小蝴蝶结 -->
          <g transform="translate(58 96) rotate(-16)">
            <path d="M0 0l-12-8v16z" fill="#9ad9f5"/>
            <path d="M0 0l12-8v16z" fill="#9ad9f5"/>
            <circle cx="0" cy="0" r="3.6" fill="#7fc9ee"/>
          </g>
        </svg>
      </div>
      <h1 class="calc__title">奶油计算器</h1>

      <!-- 显示屏：表达式行 + 结果行 + 提示条 + 后端状态 -->
      <div class="screen">
        <p class="screen__expression is-empty" id="expression" data-placeholder="输入表达式"></p>
        <p class="screen__result" id="result">—</p>
        <p class="screen__message" id="message" role="status" aria-live="polite"></p>
        <p class="screen__backend" id="backend-status">
          <span class="screen__dot" aria-hidden="true"></span>
          <span id="backend-text">后端未启用 · 结果由后端计算</span>
        </p>
      </div>

      <!--
        键盘区：★ 整个区域只挂一个 click 监听器（事件委托），见 js/calc-buttons.js。
        每个按键用 data-key 声明语义，HTML 不写任何 onclick。
      -->
      <div class="keys" id="keys">
        <button type="button" class="key key--fn" data-key="AC"   title="清空（Esc）">AC</button>
        <button type="button" class="key key--fn" data-key="BACK" title="退格（Backspace）">⌫</button>
        <button type="button" class="key key--fn" data-key="NEG"  title="正负号（n）">±</button>
        <button type="button" class="key key--fn" data-key="("    title="左括号">(</button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--fn" data-key=")" title="右括号">)</button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key--op" data-key="+" title="加（+）">+</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key--op" data-key="-" title="减（-）">−</button>

        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key="." title="小数点">.</button>
        <button type="button" class="key key--op" data-key="*" title="乘（*）">×</button>
        <button type="button" class="key key--op" data-key="/" title="除（/）">÷</button>

        <button type="button" class="key key--wide key--eq" data-key="=" title="计算（Enter / =）">=</button>
      </div>
    </section>

    <!-- 历史记录：本轮为占位区，按要求不放任何假数据 -->
    <aside class="history" aria-label="计算历史">
      <!-- 历史卡片右上角的小奶龙：同一套画法，缩小复用 -->
      <svg class="history__mascot" viewBox="0 0 240 172" aria-hidden="true">
        <circle cx="120" cy="90" r="52" fill="#ffffff" stroke="#e6f1fa" stroke-width="3"/>
        <path d="M88 66C64 64 46 84 44 114c-2 26 10 42 22 43 11 1 17-10 17-26 0-21 6-49 5-65z"
              fill="#f2f9ff" stroke="#e6f1fa" stroke-width="3"/>
        <path d="M152 66c24-2 42 18 44 48 2 26-10 42-22 43-11 1-17-10-17-26 0-21-6-49-5-65z"
              fill="#f2f9ff" stroke="#e6f1fa" stroke-width="3"/>
        <ellipse cx="101" cy="92" rx="6" ry="8" fill="#3d4f6b"/>
        <ellipse cx="139" cy="92" rx="6" ry="8" fill="#3d4f6b"/>
        <ellipse cx="86" cy="106" rx="10" ry="6" fill="#ffd3dd" opacity=".9"/>
        <ellipse cx="154" cy="106" rx="10" ry="6" fill="#ffd3dd" opacity=".9"/>
        <path d="M112 106q8 8 16 0" fill="none" stroke="#c9d8e8" stroke-width="3"
              stroke-linecap="round"/>
      </svg>
      <h2 class="history__title">计算历史</h2>
      <p class="history__placeholder">
        此区域将显示来自后端数据库的历史记录。<br>
        本轮只完成前端界面与交互，历史记录需等前后端联调阶段接入。
      </p>
    </aside>
  </main>

  <!-- 模块之间通过 DOM 上的 id 通信，不互相 import，避免循环依赖 -->
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/keyboard.js"></script>
  <script type="module" src="js/calc-buttons.js"></script>
</body>
</html>
