<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计算器 · 832401217</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 整页只有一个主区域：左侧计算器，右侧历史记录占位 -->
  <main class="app">
    <section class="calc" aria-label="计算器">
      <!--
        吉祥物：奶龙（Nailong）。
        图片来源：第七印象官方网站（nailoong.com）「IP大明星 → 奶龙」页面的形象图，
        已保存到 src/assets/nailong.png 随仓库一起提交，因此页面离线也能显示。
      -->
      <div class="calc__mascot">
        <img class="mascot" src="assets/nailong.png" alt="奶龙">
      </div>
      <h1 class="calc__title">奶龙计算器</h1>

      <!-- 显示屏：表达式行 + 结果行 + 提示条 + 后端状态 -->
      <div class="screen">
        <!-- 显示屏左下的奶龙图案（纯装饰，用 CSS 背景图实现，不参与交互） -->
        <span class="screen__mascot" aria-hidden="true"></span>
        <p class="screen__expression is-empty" id="expression" data-placeholder="输入表达式"></p>
        <p class="screen__result" id="result">—</p>
        <p class="screen__message" id="message" role="status" aria-live="polite"></p>
        <p class="screen__backend" id="backend-status">
          <span class="screen__dot" aria-hidden="true"></span>
          <span id="backend-text">后端未启用 · 结果由后端计算</span>
        </p>
      </div>

      <!--
        键盘区：★ 整个区域只挂一个 click 监听器（事件委托），见 js/calc-buttons.js。
        每个按键用 data-key 声明语义，HTML 不写任何 onclick。
      -->
      <!--
        键盘区：★ 整个区域只挂一个 click 监听器（事件委托），见 js/calc-buttons.js。
        每个按键用 data-key 声明语义，HTML 不写任何 onclick。

        排布：5 列 × 4 行，最后一行等号横跨整行（共 21 个键，正好排满）。
          第 1 行  功能键（粉色）        AC ⌫ ± ( )
          第 2 行  7 8 9 + ÷
          第 3 行  4 5 6 − ×
          第 4 行  1 2 3 0 .
          第 5 行  =（横跨整行，蓝色实心）

        注意：按键总数必须能被列数整除，否则会出现"某行只有一个键、整块错位"。
        这里 21 = 5×4 + 1（等号独占一行），所以列数必须是 5。
      -->
      <div class="keys" id="keys">
        <button type="button" class="key key--fn" data-key="AC"   title="清空（Esc）">AC</button>
        <button type="button" class="key key--fn" data-key="BACK" title="退格（Backspace）">⌫</button>
        <button type="button" class="key key--fn" data-key="NEG"  title="正负号（n）">±</button>
        <button type="button" class="key key--fn" data-key="("    title="左括号">(</button>
        <button type="button" class="key key--fn" data-key=")"    title="右括号">)</button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--op" data-key="+" title="加（+）">+</button>
        <button type="button" class="key key--op" data-key="/" title="除（/）">÷</button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key--op" data-key="-" title="减（-）">−</button>
        <button type="button" class="key key--op" data-key="*" title="乘（*）">×</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key="." title="小数点">.</button>

        <button type="button" class="key key--wide key--eq" data-key="=" title="计算（Enter / =）">=</button>
      </div>
    </section>

    <!-- 历史记录：本轮为占位区，按要求不放任何假数据 -->
    <aside class="history" aria-label="计算历史">
      <!-- 历史卡片右上角的小奶龙：同一张图缩小复用 -->
      <img class="history__mascot" src="assets/nailong.png" alt="">
      <h2 class="history__title">计算历史</h2>
      <p class="history__placeholder">
        此区域将显示来自后端数据库的历史记录。<br>
        本轮只完成前端界面与交互，历史记录需等前后端联调阶段接入。
      </p>
    </aside>
  </main>

  <!-- 模块之间通过 DOM 上的 id 通信，不互相 import，避免循环依赖 -->
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/keyboard.js"></script>
  <script type="module" src="js/calc-buttons.js"></script>
</body>
</html>
