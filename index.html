<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator · 832401217</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The whole page has a single main region: the calculator on the left, the history record
       placeholder on the right -->
  <main class="app">
    <section class="calc" aria-label="Calculator">
      <!-- The mascot image is stored locally so it still renders when the page is offline -->
      <div class="calc__mascot">
        <img class="mascot" src="assets/nailong.png" alt="Nailong">
      </div>
      <h1 class="calc__title">Nailong Calculator</h1>

      <!-- Display: expression line + result line + message bar + back-end status -->
      <div class="screen">
        <!-- Nailong artwork in the lower-left corner of the display (purely decorative, drawn
             with a CSS background image, not interactive) -->
        <span class="screen__mascot" aria-hidden="true"></span>
        <p class="screen__expression is-empty" id="expression"
           data-placeholder="Enter an expression"></p>
        <p class="screen__result" id="result">—</p>
        <p class="screen__message" id="message" role="status" aria-live="polite"></p>
        <p class="screen__backend" id="backend-status">
          <span class="screen__dot" aria-hidden="true"></span>
          <span id="backend-text">Back end not enabled — result computed by the back end</span>
        </p>
      </div>

      <!--
        Keypad: a single click listener is attached to the whole region (event delegation),
        see js/calc-buttons.js. Each key declares its semantics with data-key, and the HTML
        contains no onclick at all.

        Layout: **a fixed 4-column grid**, digits run in rows, and the equals key spans the
        whole row.
          Row 1  AC ⌫ ( )        ← 4 pink function keys
          Row 2  7 8 9 ÷
          Row 3  4 5 6 ×
          Row 4  1 2 3 −
          Row 5  0 . ± +
          Row 6  = (spans all 4 columns)

        An easy mistake worth recording here:
        the **source order** of the keys in the HTML is the **fill order** in the grid.
        An earlier version used 5 columns and did not group the keys by row, so 7 was
        squeezed onto the first row and 3 fell to the fourth, misaligning the whole keypad.
        At the time this was blamed on flex wrapping, but switching to a "fixed column
        count" did not fix it -- the real cause was the **order**, regardless of which
        layout engine is used.
      -->
      <div class="keys" id="keys">
        <button type="button" class="key key--fn" data-key="AC"   title="Clear (Esc)">AC</button>
        <button type="button" class="key key--fn" data-key="BACK" title="Backspace">⌫</button>
        <button type="button" class="key key--fn" data-key="("
                title="Left parenthesis">(</button>
        <button type="button" class="key key--fn" data-key=")"
                title="Right parenthesis">)</button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--op" data-key="/" title="Divide (/)">÷</button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key--op" data-key="*" title="Multiply (*)">×</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key--op" data-key="-" title="Subtract (-)">−</button>

        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key="." title="Decimal point">.</button>
        <button type="button" class="key key--fn" data-key="NEG" title="Sign (n)">±</button>
        <button type="button" class="key key--op" data-key="+" title="Add (+)">+</button>

        <button type="button" class="key key--wide key--eq" data-key="="
                title="Calculate (Enter / =)">=</button>
      </div>
    </section>

    <!--
      History region: all data comes from the back-end database (GET /api/history).
      No mock data is placed here -- when the list is empty it shows the empty-state
      text "No calculation records yet".
    -->
    <aside class="history" aria-label="Calculation history">
      <!-- Small Nailong in the top-right corner of the history card: the same image reused at
           a smaller size -->
      <img class="history__mascot" src="assets/nailong.png" alt="">

      <div class="history__head">
        <h2 class="history__title">Calculation history</h2>
        <span class="history__count" id="history-count" aria-live="polite"></span>
      </div>

      <!-- Search box: maps to the back-end GET /api/history?keyword=... (extension feature) -->
      <div class="history__search">
        <input
          type="search"
          id="history-keyword"
          class="history__input"
          placeholder="Search expressions, e.g. 12 or *"
          autocomplete="off"
          aria-label="Search history"
        >
        <button type="button" class="history__clear" id="history-clear"
                title="Clear all history">Clear</button>
      </div>

      <!--
        List container.
        Each record carries a "delete" button, implemented with event delegation (the same
        idea as the keypad):
          a single click listener on the whole list, see js/history.js.
      -->
      <ul class="history__list" id="history-list"></ul>

      <!-- Empty state / loading / error message: one element reused for all three cases -->
      <p class="history__status" id="history-status" role="status" aria-live="polite"></p>
    </aside>
  </main>

  <!--
    This loads the **classic script** bundle.js instead of an ES module, because:
      browsers do not execute <script type="module"> on file:// pages, so when this file is
      opened by double-clicking, the module is rejected by the cross-origin policy and no
      interaction works at all (the page looks normal, but clicking the buttons does
      nothing).

    bundle.js is generated by tools/build-bundle.mjs, which merges the modules under
    src/js/. To change the logic, edit the source files and then run:
    node tools/build-bundle.mjs
  -->
  <script src="js/bundle.js"></script>
</body>
</html>
